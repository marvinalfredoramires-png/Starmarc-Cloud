<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starmarc Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    
    <!-- Header / Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-sky-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-sky-500/20">
        <i class="fa-solid fa-cloud text-3xl text-white"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-wide">STARMARC <span class="text-sky-400">CLOUD</span></h1>
      <p class="text-slate-400 text-sm mt-1" id="subtitle">Crea tu cuenta para gestionar tus archivos</p>
    </div>

    <!-- Botones Redes Sociales -->
    <div class="space-y-3 mb-6">
      <button class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-xl border border-slate-700 flex items-center justify-center gap-3 transition">
        <i class="fa-brands fa-google text-red-400"></i> Continuar con Google
      </button>
      <button class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-xl border border-slate-700 flex items-center justify-center gap-3 transition">
        <i class="fa-brands fa-facebook text-blue-500"></i> Continuar con Facebook
      </button>
    </div>

    <!-- Separador -->
    <div class="relative my-6 text-center">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
      <span class="relative px-3 bg-slate-900 text-xs text-slate-500 uppercase tracking-wider">o con correo</span>
    </div>

    <!-- Mensaje de Error / Éxito -->
    <div id="error-message" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-xl text-center"></div>
    <div id="success-message" class="hidden mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs rounded-xl text-center"></div>

    <!-- Formulario -->
    <form id="auth-form" class="space-y-4">
      <div id="field-nombre">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Marvin Ramirez" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 text-sm transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 text-sm transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 text-sm transition">
      </div>

      <button type="submit" id="btn-submit" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-sky-500/20 transition mt-2">
        Registrarse
      </button>
    </form>

    <!-- Switch entre Login y Registro -->
    <div class="text-center mt-6 text-sm text-slate-400">
      <span id="toggle-text">¿Ya tienes una cuenta?</span>
      <button id="toggle-btn" class="text-sky-400 font-semibold hover:underline ml-1">Inicia sesión</button>
    </div>

  </div>

  <script>
    let isRegisterMode = true;

    const authForm = document.getElementById('auth-form');
    const fieldNombre = document.getElementById('field-nombre');
    const btnSubmit = document.getElementById('btn-submit');
    const toggleBtn = document.getElementById('toggle-btn');
    const toggleText = document.getElementById('toggle-text');
    const subtitle = document.getElementById('subtitle');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');

    // Cambiar entre pantalla de Registro e Inicio de Sesión
    toggleBtn.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');

      if (isRegisterMode) {
        fieldNombre.classList.remove('hidden');
        btnSubmit.textContent = 'Registrarse';
        toggleText.textContent = '¿Ya tienes una cuenta?';
        toggleBtn.textContent = 'Inicia sesión';
        subtitle.textContent = 'Crea tu cuenta para gestionar tus archivos';
      } else {
        fieldNombre.classList.add('hidden');
        btnSubmit.textContent = 'Iniciar Sesión';
        toggleText.textContent = '¿No tienes cuenta?';
        toggleBtn.textContent = 'Regístrate';
        subtitle.textContent = 'Ingresa tus credenciales para acceder';
      }
    });

    // Enviar formulario al backend
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const nombre = isRegisterMode ? document.getElementById('nombre').value : '';

      const endpoint = isRegisterMode ? '/api/register' : '/api/login';
      const payload = isRegisterMode ? { nombre, email, password } : { email, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          successMessage.textContent = data.message;
          successMessage.classList.remove('hidden');
        } else {
          errorMessage.textContent = data.error || 'Ocurrió un error al procesar la solicitud';
          errorMessage.classList.remove('hidden');
        }
      } catch (err) {
        console.error('Error de conexión:', err);
        errorMessage.textContent = 'Error al conectar con el servidor';
        errorMessage.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
