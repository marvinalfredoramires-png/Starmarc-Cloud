<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starmarc Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

  <!-- ==================== CONTENEDOR DE AUTENTICACIÓN ==================== -->
  <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
      
      <!-- Header / Logo -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-sky-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-cloud text-3xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-wide">STARMARC <span class="text-sky-400">CLOUD</span></h1>
        <p class="text-slate-400 text-sm mt-1" id="subtitle">Crea tu cuenta para gestionar tus archivos</p>
      </div>

      <!-- Botones Redes Sociales -->
      <div class="space-y-3 mb-6">
        <button type="button" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-xl border border-slate-700 flex items-center justify-center gap-3 transition">
          <i class="fa-brands fa-google text-red-400"></i> Continuar con Google
        </button>
        <button type="button" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-xl border border-slate-700 flex items-center justify-center gap-3 transition">
          <i class="fa-brands fa-facebook text-blue-500"></i> Continuar con Facebook
        </button>
      </div>

      <!-- Separador -->
      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
        <span class="relative px-3 bg-slate-900 text-xs text-slate-500 uppercase tracking-wider">o con correo</span>
      </div>

      <!-- Mensajes de Estado -->
      <div id="error-message" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-xl text-center"></div>
      <div id="success-message" class="hidden mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs rounded-xl text-center"></div>

      <!-- Formulario de Autenticación -->
      <form id="auth-form" class="space-y-4">
        <div id="field-nombre">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nombre Completo</label>
          <input type="text" id="nombre" placeholder="Marvin Ramirez" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 text-sm transition text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="correo@ejemplo.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 text-sm transition text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 text-sm transition text-white">
        </div>

        <button type="submit" id="btn-submit" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-sky-500/20 transition mt-2">
          Registrarse
        </button>
      </form>

      <!-- Switch entre Login y Registro -->
      <div class="text-center mt-6 text-sm text-slate-400">
        <span id="toggle-text">¿Ya tienes una cuenta?</span>
        <button type="button" id="toggle-btn" class="text-sky-400 font-semibold hover:underline ml-1">Inicia sesión</button>
      </div>

    </div>
  </div>


  <!-- ==================== CONTENEDOR DEL DASHBOARD / ARCHIVOS ==================== -->
  <div id="dashboard-container" class="hidden min-h-screen flex flex-col">
    
    <!-- Navbar Superior -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center shadow-md shadow-sky-500/20">
          <i class="fa-solid fa-cloud text-xl text-white"></i>
        </div>
        <span class="text-lg font-bold tracking-wide">STARMARC <span class="text-sky-400">CLOUD</span></span>
      </div>

      <div class="flex items-center gap-4">
        <span id="user-display" class="text-sm text-slate-300 font-medium"><i class="fa-regular fa-user mr-2"></i>Usuario</span>
        <button id="btn-logout" class="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-red-400 border border-slate-700 rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
      </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 p-6 max-w-6xl w-full mx-auto space-y-6">
      
      <!-- Zona de Subida de Archivos (Upload Dropzone) -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-sky-400"></i> Subir Archivo
        </h2>
        
        <form id="upload-form" class="flex flex-col sm:flex-row items-center gap-4">
          <input type="file" id="file-input" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-500 file:text-slate-950 hover:file:bg-sky-400 bg-slate-950 rounded-xl border border-slate-800 p-2 cursor-pointer">
          <button type="submit" id="btn-upload" class="w-full sm:w-auto px-6 py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-sky-500/20 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-upload"></i> Subir
          </button>
        </form>

        <div id="upload-status" class="hidden mt-4 p-3 rounded-xl text-xs text-center"></div>
      </section>

      <!-- Galería / Lista de Archivos -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-folder-open text-sky-400"></i> Mis Archivos
          </h2>
          <button id="btn-refresh" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-xl border border-slate-700 transition flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> Actualizar
          </button>
        </div>

        <div id="files-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Los archivos cargados desde R2 se insertan dinámicamente aquí -->
        </div>

        <div id="empty-state" class="text-center py-12 text-slate-500 hidden">
          <i class="fa-solid fa-box-open text-4xl mb-3"></i>
          <p class="text-sm">No hay archivos subidos aún.</p>
        </div>
      </section>

    </main>
  </div>


  <!-- ==================== LÓGICA DE JAVASCRIPT ==================== -->
  <script>
    let isRegisterMode = true;

    // Elementos Autenticación
    const authContainer = document.getElementById('auth-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const authForm = document.getElementById('auth-form');
    const fieldNombre = document.getElementById('field-nombre');
    const btnSubmit = document.getElementById('btn-submit');
    const toggleBtn = document.getElementById('toggle-btn');
    const toggleText = document.getElementById('toggle-text');
    const subtitle = document.getElementById('subtitle');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const userDisplay = document.getElementById('user-display');
    const btnLogout = document.getElementById('btn-logout');

    // Elementos Dashboard Archivos
    const uploadForm = document.getElementById('upload-form');
    const fileInput = document.getElementById('file-input');
    const uploadStatus = document.getElementById('upload-status');
    const filesList = document.getElementById('files-list');
    const emptyState = document.getElementById('empty-state');
    const btnRefresh = document.getElementById('btn-refresh');

    // Cambiar entre Registro e Inicio de Sesión
    toggleBtn.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');

      if (isRegisterMode) {
        fieldNombre.classList.remove('hidden');
        btnSubmit.textContent = 'Registrarse';
        toggleText.textContent = '¿Ya tienes una cuenta?';
        toggleBtn.textContent = 'Inicia sesión';
        subtitle.textContent = 'Crea tu cuenta para gestionar tus archivos';
      } else {
        fieldNombre.classList.add('hidden');
        btnSubmit.textContent = 'Iniciar Sesión';
        toggleText.textContent = '¿No tienes cuenta?';
        toggleBtn.textContent = 'Regístrate';
        subtitle.textContent = 'Ingresa tus credenciales para acceder';
      }
    });

    // Enviar Registro / Inicio de Sesión
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const nombre = isRegisterMode ? document.getElementById('nombre').value : '';

      const endpoint = isRegisterMode ? '/api/register' : '/api/login';
      const payload = isRegisterMode ? { nombre, email, password } : { email, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          successMessage.textContent = isRegisterMode ? '¡Usuario registrado correctamente!' : '¡Inicio de sesión exitoso!';
          successMessage.classList.remove('hidden');

          // Pasar al Dashboard tras 1 segundo
          setTimeout(() => {
            showDashboard(data.user?.nombre || email);
          }, 1000);

        } else {
          errorMessage.textContent = data.error || 'Error en la solicitud';
          errorMessage.classList.remove('hidden');
        }
      } catch (err) {
        console.error('Error:', err);
        errorMessage.textContent = 'Error al conectar con el servidor';
        errorMessage.classList.remove('hidden');
      }
    });

    // Transición al Dashboard
    function showDashboard(username) {
      authContainer.classList.add('hidden');
      dashboardContainer.classList.remove('hidden');
      userDisplay.innerHTML = `<i class="fa-regular fa-user mr-2"></i>${username}`;
      loadFiles();
    }

    // Cerrar Sesión
    btnLogout.addEventListener('click', () => {
      dashboardContainer.classList.add('hidden');
      authContainer.classList.remove('hidden');
      authForm.reset();
      successMessage.classList.add('hidden');
      errorMessage.classList.add('hidden');
    });

    // Cargar Lista de Archivos desde R2
    async function loadFiles() {
      filesList.innerHTML = '<div class="col-span-full text-center py-6 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Cargando archivos...</div>';
      emptyState.classList.add('hidden');

      try {
        const response = await fetch('/api/files');
        const data = await response.json();

        if (response.ok && data.files && data.files.length > 0) {
          filesList.innerHTML = '';
          data.files.forEach(file => {
            const fileCard = document.createElement('div');
            fileCard.className = 'bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col justify-between hover:border-sky-500/50 transition';
            fileCard.innerHTML = `
              <div class="flex items-start gap-3 mb-3">
                <div class="w-10 h-10 bg-slate-800 text-sky-400 rounded-lg flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-file text-lg"></i>
                </div>
                <div class="overflow-hidden">
                  <p class="text-sm font-semibold text-white truncate" title="${file.key}">${file.key}</p>
                  <p class="text-xs text-slate-500">${(file.size / 1024).toFixed(1)} KB</p>
                </div>
              </div>
              <a href="${file.url}" target="_blank" download class="w-full py-2 bg-slate-800 hover:bg-sky-500 hover:text-slate-950 text-slate-300 text-xs font-semibold rounded-lg text-center transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> Descargar
              </a>
            `;
            filesList.appendChild(fileCard);
          });
        } else {
          filesList.innerHTML = '';
          emptyState.classList.remove('hidden');
        }
      } catch (err) {
        console.error('Error al cargar archivos:', err);
        filesList.innerHTML = '<div class="col-span-full text-center py-6 text-red-400">Error al obtener archivos desde Cloudflare R2</div>';
      }
    }

    btnRefresh.addEventListener('click', loadFiles);

    // Subir Archivo a Cloudflare R2
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      uploadStatus.className = 'mt-4 p-3 rounded-xl text-xs text-center bg-sky-500/10 border border-sky-500/30 text-sky-400';
      uploadStatus.textContent = 'Subiendo archivo a Cloudflare R2...';
      uploadStatus.classList.remove('hidden');

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
          uploadStatus.className = 'mt-4 p-3 rounded-xl text-xs text-center bg-emerald-500/10 border border-emerald-500/30 text-emerald-400';
          uploadStatus.textContent = '¡Archivo subido con éxito!';
          uploadForm.reset();
          loadFiles();
        } else {
          uploadStatus.className = 'mt-4 p-3 rounded-xl text-xs text-center bg-red-500/10 border border-red-500/30 text-red-400';
          uploadStatus.textContent = data.error || 'Error al subir el archivo';
        }
      } catch (err) {
        console.error('Error al subir:', err);
        uploadStatus.className = 'mt-4 p-3 rounded-xl text-xs text-center bg-red-500/10 border border-red-500/30 text-red-400';
        uploadStatus.textContent = 'Error de conexión al subir archivo';
      }
    });
  </script>

</body>
</html>
